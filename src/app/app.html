<div style="font-family: Arial, sans-serif; padding: 24px; background-color: #f3f4f6; min-height: 100vh;">
  <h1 style="text-align: center; margin-bottom: 24px;">Watchlist App</h1>

  <div style="max-width: 700px; margin: 0 auto 24px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <app-form (addItem)="addWatchlist($event)"></app-form>
  </div>

  <div style="max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <app-list
      [items]="watchlists"
      (toggleWatched)="toggleWatched($any($event).id, $any($event).watched)"> </app-list>
  </div>
</div>
